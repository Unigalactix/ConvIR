name: CI Pipeline - Unigalactix/ConvIR

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
 
env:
  CI: true
  PYTHON_VERSION: "3.9"
  CODEQL_LANGUAGE: python
 
jobs:
 
  # -------------------------------------------------
  # JOB 1: BUILD & TEST
  # -------------------------------------------------
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
 
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
 
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
 
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install torch torchvision numpy pillow scikit-image tensorboard pytest
 
      - name: Lint with Python
        run: |
          pip install flake8
          # Stop the build if there are Python syntax errors or undefined names
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics --exclude=.git,__pycache__,.ipynb_checkpoints
          # Exit-zero treats all errors as warnings
          flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics --exclude=.git,__pycache__,.ipynb_checkpoints
 
      - name: Verify PyTorch installation
        run: |
          python -c "import torch; print(f'PyTorch version: {torch.__version__}'); print(f'CUDA available: {torch.cuda.is_available()}')"
 
      - name: Test notebook can be parsed
        run: |
          if [ -f "ConvIR.ipynb" ]; then
            pip install nbformat jupyter
            python -c "import nbformat; nb = nbformat.read('ConvIR.ipynb', as_version=4); print(f'Notebook has {len(nb.cells)} cells')"
          else
            echo "No notebook found, skipping validation"
          fi
 
  # -------------------------------------------------
  # JOB 2: SECURITY SCANS
  # -------------------------------------------------
  security-scan:
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      actions: read
      contents: read
 
    steps:
      - uses: actions/checkout@v4
 
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ env.CODEQL_LANGUAGE }}
 
      - name: Autobuild
        uses: github/codeql-action/autobuild@v3
 
      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
 
  # -------------------------------------------------
  # JOB 3: DOCKER BUILD & PUSH
  # -------------------------------------------------
  docker-build:
    runs-on: ubuntu-latest
    needs: [build, security-scan]
    permissions:
      contents: read
    outputs:
      repo_lower: ${{ steps.compute_repo.outputs.repo_lower }}
 
    steps:
      - uses: actions/checkout@v4
 
      - name: Compute lowercase repo name
        id: compute_repo
        run: |
          REPO_LOWER=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')
          echo "REPO_LOWER=${REPO_LOWER}" >> $GITHUB_ENV
          echo "repo_lower=${REPO_LOWER}" >> $GITHUB_OUTPUT
 
      - name: Login to ACR
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.ACR_LOGIN_SERVER }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}
 
      - name: Build and push image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.ACR_LOGIN_SERVER }}/${{ env.REPO_LOWER }}:latest
            ${{ secrets.ACR_LOGIN_SERVER }}/${{ env.REPO_LOWER }}:${{ github.sha }}
 
  # -------------------------------------------------
  # JOB 4: DEPLOY (Publish Profile, Image-based)
  # -------------------------------------------------
  deploy:
    runs-on: ubuntu-latest
    needs: docker-build
    environment: 'Production'
    permissions:
      contents: read
 
    steps:
      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v2
        with:
          app-name: ${{ secrets.AZURE_WEBAPP_APP_NAME }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          images: ${{ secrets.ACR_LOGIN_SERVER }}/${{ needs.docker-build.outputs.repo_lower }}:${{ github.sha }}
